workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: apps/mobile
    integrations:
      # Team-wide App Store Connect API key (Codemagic → Integrations → Developer Portal).
      app_store_connect: Venue Wrangler Wine
    environment:
      flutter: 3.47.5
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.venuewrangler.app"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        # Public client config (the anon key is designed to ship in the app — authorization
        # is enforced by Postgres RLS). Not secret, so safe to keep in this file.
        SUPABASE_URL: "https://puttwjwmwrzmhpsjykuj.supabase.co"
        SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB1dHR3andtd3J6bWhwc2p5a3VqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5NTI5MTEsImV4cCI6MjEwNjUyODkxMX0.U5TR_8BdtkkT0qpG4oNuhDh4m52mlsltH44ex8budIQ"
        # Sentry DSNs are public by design (they can only submit events), like the anon key.
        SENTRY_DSN: "https://01fa184f9164f8f0bfb8250ca79e9c28@o4511660428820480.ingest.us.sentry.io/4511961182044160"
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "ios-v*"
      cancel_previous_builds: false
    scripts:
      - name: Install Flutter dependencies
        script: flutter packages pub get
      - name: Verify formatting
        script: dart format --output=none --set-exit-if-changed lib test
      - name: Static analysis
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Set up iOS code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          # TestFlight rejects a build number it has already seen, so always go one past the
          # latest uploaded build for this app (and never below Codemagic's own counter).
          APP_ID=$(app-store-connect apps list \
            --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json \
            | jq -r '.[0].id // empty')
          LATEST=0
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID" 2>/dev/null || echo 0)
          fi
          NEXT=$(( LATEST + 1 ))
          if [ "${BUILD_NUMBER:-0}" -gt "$NEXT" ]; then NEXT=$BUILD_NUMBER; fi
          echo "Building with build number $NEXT (latest on TestFlight: $LATEST)"
          flutter build ipa --release \
            -t lib/main_production.dart \
            --build-number=$NEXT \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY \
            --dart-define=SENTRY_DSN=$SENTRY_DSN \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - "/tmp/xcodebuild_logs/*.log"
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers only until App Attest/APNs/App Links have been verified on a
        # physical device per docs/migration/flutter-cutover-closeout-2026-10-03.md — flip to
        # beta_groups/submit_to_app_store once that's done.
        beta_groups:
          - "Internal Testers"
