name: Site CI

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/marketing/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  build-site:
    name: Build and test marketing site
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      # Fails on high/critical advisories in production dependencies (audit O-05).
      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Test
        run: npm test

      - name: Build site
        # The Flutter web app (/app) is built only by the deploy workflow, which installs Flutter
        # and provides env/production.json.
        env:
          SITE_SKIP_FLUTTER: '1'
        run: npm run build:site
