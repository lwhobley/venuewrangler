name: Dependency Security Audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/api/package.json'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/audit-gate.mjs'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'packages/api/package.json'
      - '.github/workflows/dependency-audit.yml'
      - 'scripts/audit-gate.mjs'
  schedule:
    - cron: '30 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-production:
    name: API production dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on high/critical API production vulnerabilities
        run: node scripts/audit-gate.mjs --omit=dev --workspace=@venue-wrangler/api
      - name: Verify the patched Prisma config override remains compatible
        run: |
          set -Eeuo pipefail
          installed="$(node -p "require('./node_modules/deepmerge-ts/package.json').version")"
          [[ "$installed" == "8.0.0" ]] || { echo "::error::Expected patched deepmerge-ts 8.0.0, found ${installed}"; exit 1; }
          npm run build --workspace=@venue-wrangler/api

  mobile-toolchain:
    name: Mobile production dependency gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on high/critical mobile production vulnerabilities
        run: node scripts/audit-gate.mjs --omit=dev

  full-inventory:
    name: Full dependency inventory
    runs-on: ubuntu-latest
    # Enforcing rather than reporting. This job was continue-on-error, so it
    # was the only one that inspected dev dependencies and the only one that
    # could never fail — which is how an unused `image-size` devDependency sat
    # on a high-severity advisory (no fix available) without blocking anything.
    # The tree is clean as of its removal, and a clean baseline is exactly when
    # this can be enforced.
    #
    # If a future advisory has genuinely no fix, do not silently revert this to
    # continue-on-error: add a documented exemption in the same commit, the way
    # the RLS migration gate lists its exemptions explicitly.
    #
    # `npm audit` has no per-advisory exclude flag, so all three jobs run
    # scripts/audit-gate.mjs, which wraps `npm audit --json` and fails on any
    # high/critical advisory not listed in its ALLOWED table. Each entry
    # records why it is accepted and what makes it removable, and an entry that
    # stops matching the tree fails the build so exemptions cannot rot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report all high/critical vulnerabilities including dev tooling
        run: node scripts/audit-gate.mjs
