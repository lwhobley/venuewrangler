name: Supabase CI

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase-ci.yml'

permissions:
  contents: read

jobs:
  rls-authorization-tests:
    name: Apply migrations and run RLS authorization tests
    runs-on: ubuntu-latest

    services:
      # supabase/postgres (not vanilla postgres:16): bundles pgtap, pg_net and pg_cron, none
      # of which are available in vanilla Postgres (no contrib/apt package installs them into
      # a *service container*, as opposed to the runner itself - `apt-get install
      # postgresql-16-pgtap` on the runner VM has no effect on a separate Docker container's
      # filesystem, which is what this used to do here). Tag matches supabase/config.toml's
      # major_version (15).
      postgres:
        image: supabase/postgres:15.19.0.004
        env:
          # This image's own bootstrap (/docker-entrypoint-initdb.d/migrate.sh, which sets up
          # pgtap/pg_net/pg_cron, the auth/storage schemas, etc.) is hardcoded to connect as
          # "supabase_admin" regardless of POSTGRES_USER - overriding it to "postgres" (as a
          # vanilla postgres:16 image would need) breaks that bootstrap with "role
          # supabase_admin does not exist" before our own steps ever run. Use its actual
          # superuser name instead of fighting it.
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Connect as "postgres", not the supabase_admin bootstrap superuser above: this image's
      # own init migrations (supabase/postgres's demote-postgres.sql) set up "postgres" as a
      # separate, pre-existing CREATEDB/CREATEROLE/BYPASSRLS role - the actual project-owner
      # role real Supabase migrations run as, which supabase/migrations/..._ensure_public_
      # grants.sql's "alter default privileges for role postgres" already assumes.
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: supabase_migration_check

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pg_prove (the TAP harness the last step runs) comes from
      # libtap-parser-sourcehandler-pgtap-perl, which postgresql-16-pgtap only Recommends,
      # not Depends on - --no-install-recommends (kept for a lean CI image) skips it unless
      # named explicitly. This was always missing; it just never ran far enough to matter.
      - name: Install psql client and pg_prove
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16 libtap-parser-sourcehandler-pgtap-perl

      # Must connect to the pre-existing "postgres" database here, not $PGDATABASE
      # (supabase_migration_check) — that's the database this step creates, so
      # connecting to it first is a chicken-and-egg error.
      - name: Create test database
        run: psql -h localhost -U postgres -d postgres -c "CREATE DATABASE supabase_migration_check;"

      # Stubs the parts of a real Supabase project (auth schema, auth.uid(), anon/
      # authenticated/service_role roles) that the migrations under supabase/migrations
      # assume already exist. This file is CI-only fixture, never applied to a real
      # Supabase project — see supabase/tests/ci_auth_stub.sql for why.
      - name: Apply CI auth/role stub
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ci_auth_stub.sql

      # Must run before the migrations (unlike the grants stub below): the storage-buckets
      # migration inserts into storage.buckets and creates policies on storage.objects, which
      # this stub is what creates those tables at all outside a real Supabase project. See
      # supabase/tests/ci_storage_stub.sql for why.
      - name: Apply CI storage stub
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ci_storage_stub.sql

      - name: Apply migrations in order
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Applying $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      # Real Supabase grants broad table-level privileges to anon/authenticated by default
      # and relies on RLS (not GRANT) for row-level filtering. Applied only after the
      # migrations create the tables.
      - name: Apply CI grants stub
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ci_grants_stub.sql

      - name: Install pgTAP extension
        # The migrations set global default privileges (no PUBLIC execute on new functions), so pgTAP
        # lives in its own schema that is opened up explicitly; this also keeps `public` free of
        # test objects for supabase/tests/database/security_invariants.test.sql.
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS tap; CREATE EXTENSION IF NOT EXISTS pgtap SCHEMA tap;"
          psql -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA tap TO PUBLIC; GRANT EXECUTE ON ALL FUNCTIONS IN SCHEMA tap TO PUBLIC;"
          psql -v ON_ERROR_STOP=1 -c "ALTER DATABASE $PGDATABASE SET search_path = public, tap;"

      - name: Run RLS authorization tests
        run: pg_prove --dbname "$PGDATABASE" supabase/tests/database/*.test.sql

  edge-functions-check:
    name: Deno check, lint and test Edge Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # deno.json sets nodeModulesDir: "auto" so bare npm:/jsr: import-map specifiers
      # (e.g. "@supabase/supabase-js") resolve through node_modules - deno check doesn't
      # install them on its own, so without this, every such import fails with "not a
      # dependency" on a fresh checkout.
      #
      # --frozen makes the install fail if deno.lock does not exactly cover the imports in
      # deno.json (audit O-05), so a dependency can only change through a reviewed lockfile
      # diff. Regenerate with `deno install` in supabase/functions and commit deno.lock.
      - name: Install npm dependencies for Edge Functions (frozen lockfile)
        working-directory: supabase/functions
        run: deno install --frozen

      - name: Deno check all functions
        run: |
          set -euo pipefail
          for entry in supabase/functions/*/index.ts; do
            echo "Checking $entry"
            deno check "$entry"
          done
          deno check supabase/functions/_shared/venue-auth.ts

      - name: Deno lint
        run: deno lint supabase/functions

      - name: Deno test shared modules
        run: deno test --permit-no-files supabase/functions/_shared/
