name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/marketing/**'
      - 'components/**'
      - 'lib/**'
      - 'modules/**'
      - 'assets/**'
      - 'app.json'
      - 'app.config.js'
      - 'site/_worker.js'
      - 'site/_routes.json'
      - 'scripts/build-site.mjs'
      - 'scripts/site-build-files.mjs'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'vitest.ui.config.mts'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'packages/marketing/**'
      - 'components/**'
      - 'lib/**'
      - 'modules/**'
      - 'assets/**'
      - 'app.json'
      - 'app.config.js'
      - 'site/_worker.js'
      - 'site/_routes.json'
      - 'scripts/build-site.mjs'
      - 'scripts/site-build-files.mjs'
      - 'eas.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'vitest.ui.config.mts'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run doctor
      - run: npm run api:prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui -- --coverage
      - name: Verify Expo web bundle
        run: npm run build:site
