name: Build API image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Resolve production image destination
        run: |
          set -Eeuo pipefail
          service_json="$(gcloud run services describe venue-wrangler-api --project venuewrangler --region us-east1 --format=json)"
          revision="$(jq -r '.status.traffic | map(select((.percent // 0) > 0)) | max_by(.percent) | .revisionName // empty' <<<"$service_json")"
          [[ -n "$revision" ]] || { echo "::error::No traffic-serving API revision found"; exit 1; }
          serving_image="$(gcloud run revisions describe "$revision" --project venuewrangler --region us-east1 --format='value(status.imageDigest)')"
          image_base="${serving_image%@sha256:*}"
          [[ "$image_base" =~ ^us-east1-docker\.pkg\.dev/venuewrangler/.+/venue-wrangler-api$ ]] || {
            echo "::error::Serving API revision does not use a trusted Venue Wrangler image path"
            exit 1
          }
          echo "IMAGE_BASE=$image_base" >> "$GITHUB_ENV"
          echo "Building for the serving API image path: $image_base"

      - name: Build and push immutable API image
        run: |
          set -Eeuo pipefail
          IMAGE_TAG="${IMAGE_BASE}:${GITHUB_SHA}"
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Could not resolve the pushed image to an immutable digest"
            exit 1
          }
          echo "Image: ${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_STEP_SUMMARY"
