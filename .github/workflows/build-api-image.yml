name: Build API image

on:
  workflow_dispatch:
    inputs:
      inspect_only:
        description: Inspect the current API image and available registry repositories without building
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Inspect production image destination
        run: |
          set -Eeuo pipefail
          service_json="$(gcloud run services describe venue-wrangler-api --project venuewrangler --region us-east1 --format=json)"
          revision="$(jq -r '.status.traffic | map(select((.percent // 0) > 0)) | max_by(.percent) | .revisionName // empty' <<<"$service_json")"
          [[ -n "$revision" ]] || { echo "::error::No traffic-serving API revision found"; exit 1; }
          serving_image="$(gcloud run revisions describe "$revision" --project venuewrangler --region us-east1 --format='value(status.imageDigest)')"
          echo "Serving API image path: ${serving_image%@sha256:*}"
          echo 'Artifact Registry repositories in us-east1:'
          gcloud artifacts repositories list --project venuewrangler --location us-east1 --format='value(name)'

      - name: Build and push immutable API image
        if: ${{ !inputs.inspect_only }}
        env:
          IMAGE_TAG: us-east1-docker.pkg.dev/venuewrangler/stadium-wrangler/venue-wrangler-api:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Could not resolve the pushed image to an immutable digest"
            exit 1
          }
          echo "Image: ${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_STEP_SUMMARY"
