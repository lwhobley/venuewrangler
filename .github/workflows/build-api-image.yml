name: Build API image

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Build and push immutable API image
        env:
          IMAGE_TAG: us-east1-docker.pkg.dev/venuewrangler/stadium-wrangler/venue-wrangler-api:${{ github.sha }}
        run: |
          set -Eeuo pipefail
          gcloud auth configure-docker us-east1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"
          digest="$(gcloud artifacts docker images describe "$IMAGE_TAG" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::Could not resolve the pushed image to an immutable digest"
            exit 1
          }
          echo "Image: ${IMAGE_TAG%:*}@${digest}" >> "$GITHUB_STEP_SUMMARY"
