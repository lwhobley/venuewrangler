name: Deploy Cloudflare Pages

on:
  push:
    # Only desktop-web deploys. It is the Cloudflare Pages project's
    # Production Branch, so it is the single source of what venuewrangler.com
    # serves. Do NOT add main here: this job always deploys under the
    # --branch desktop-web label, so a main push would publish main's site/
    # straight to production and silently clobber desktop-web's live content.
    # Site changes made on main must be ported to desktop-web to go live.
    branches:
      - desktop-web
    paths:
      - 'site/**'
      - 'packages/marketing/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'modules/**'
      - 'assets/**'
      - 'public/**'
      - 'app.json'
      - 'app.config.js'
      - 'package.json'
      - 'package-lock.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'scripts/build-site.mjs'
      - 'scripts/site-build-files.mjs'
      - '.github/workflows/deploy-cloudflare-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    # workflow_dispatch carries no branch filter, so without this guard a manual
    # run from ANY branch would publish that branch's site/ to production under
    # the hardcoded --branch desktop-web label — exactly what the push filter
    # above exists to prevent.
    if: github.ref == 'refs/heads/desktop-web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Build current Expo client and marketing site
        run: npm run build:site

      # dist-site/ combines the marketing pages with a fresh /app web bundle.
      # The Cloudflare Pages project's Production Branch is set to
      # "desktop-web" (not "main") — deploying under any other branch name
      # only creates a Preview, so this must match that setting exactly for
      # pushes to actually reach venuewrangler.com. If the Cloudflare project
      # setting is ever changed, update this to match.
      - name: Deploy landing site to Cloudflare Pages
        run: npx wrangler@3.114.17 pages deploy dist-site --project-name venue-wrangler --branch desktop-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
