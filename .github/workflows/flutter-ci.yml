name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'flutter-version.txt'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'flutter-version.txt'
      - '.github/workflows/flutter-ci.yml'

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # flutter-action's flutter-version-file only understands FVM JSON or a pubspec
      # with environment.flutter — a plain version text file is ignored and latest
      # stable is installed. Read the pin ourselves so CI matches Codemagic.
      - name: Read Flutter version pin
        id: flutter-version
        working-directory: .
        run: echo "version=$(tr -d '[:space:]' < flutter-version.txt)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
