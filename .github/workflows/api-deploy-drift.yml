name: API Deploy Drift Check

# Read-only: inspect actual traffic-serving images, not a deploy workflow SHA.
# Older images without a build-input manifest fail closed until rebuilt.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_PROJECT_ID: venuewrangler
      GCP_REGION: us-east1
      CLOUD_RUN_SERVICE: venue-wrangler-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Compare every traffic-serving revision with main
        shell: bash
        run: |
          set -Eeuo pipefail
          revisions="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json | jq -r '.status.traffic[] | select((.percent // 0) > 0) | .revisionName' | sort -u)"
          [[ -n "$revisions" ]] || { echo '::error::No serving revision found'; exit 1; }
          failed=0
          while IFS= read -r revision; do
            image="$(gcloud run revisions describe "$revision" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.imageDigest)')"
            [[ "$image" =~ ^([a-z0-9-]+-docker\.pkg\.dev|([a-z]+\.)?gcr\.io)/venuewrangler/.+@sha256:[a-f0-9]{64}$ ]] || { echo '::error::Serving revision has no trusted immutable image'; exit 1; }
            gcloud auth configure-docker "${image%%/*}" --quiet
            docker pull "$image" --quiet >/dev/null
            container="$(docker create "$image")"
            trap 'docker rm "$container" >/dev/null 2>&1 || true' EXIT
            manifest="$RUNNER_TEMP/serving-api-manifest.json"
            # Copy metadata only. Never execute the image or upload its contents.
            if ! docker cp "$container:/app/api-source-manifest.json" "$manifest"; then
              echo '::error::Serving image predates source manifests; rebuild before claiming parity.'
              failed=1
            elif ! node scripts/api-source-manifest.mjs --compare "$manifest"; then
              failed=1
            fi
            docker rm "$container" >/dev/null
            trap - EXIT
          done <<< "$revisions"
          exit "$failed"
