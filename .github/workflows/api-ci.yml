name: API CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'vitest.integration.config.mts'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vitest.config.mts'
      - 'vitest.integration.config.mts'
      - '.github/workflows/api-ci.yml'

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Typecheck, build, migrate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: venuetest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/venuetest?sslmode=disable
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/venuetest?sslmode=disable
      JWT_SECRET: "ci-test-secret-not-used-in-prod!"
      # S3ImageService requires these at boot (getOrThrow). The smoke test only
      # checks that the app starts and serves /api/health; no S3 calls are made,
      # so placeholder values are sufficient.
      AWS_ACCESS_KEY_ID: ci-test-access-key
      AWS_SECRET_ACCESS_KEY: ci-test-secret-key
      AWS_S3_BUCKET: ci-test-bucket

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @venue-wrangler/api

      - name: Typecheck
        run: npm run lint -w @venue-wrangler/api

      - name: Run unit tests (with coverage gate)
        run: npm test -- --coverage

      - name: Create integration test database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c 'CREATE DATABASE venuetest_integration;'

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/venuetest_integration?sslmode=disable
        run: npm run test:integration -w @venue-wrangler/api

      - name: Build
        run: npm run build -w @venue-wrangler/api

      - name: Lint post-lockdown migrations for RLS coverage
        run: |
          set -Eeuo pipefail
          # The Supabase Data API lockdown (20260805120000) enabled RLS on every
          # table that existed at the time; RLS ENABLE is per-table and is NOT
          # covered by ALTER DEFAULT PRIVILEGES, so any migration after it that
          # creates a table must enable RLS in the same migration.
          LOCKDOWN=20260805120000
          # Historical exemptions. Each created a table without RLS and was
          # followed immediately by a migration enabling it. Migrations are
          # immutable, so each pair's first half is exempted explicitly:
          #   20260808134500_ai_usage_metering
          #     -> 20260808150000_harden_ai_usage_event_rls
          #   20260820170000_add_device_attestation
          #     -> 20260820180000_harden_device_attestation_rls
          #   20260910030000_retain_pos_history
          #   20260910080000_retain_staff_requests
          #     -> 20260910090000_harden_retained_tables_rls
          EXEMPT=(20260808134500 20260820170000 20260910030000 20260910080000)
          for dir in packages/api/prisma/migrations/*/; do
            name="$(basename "$dir")"
            [[ "$name" > "$LOCKDOWN" ]] || continue
            skip=0
            for ex in "${EXEMPT[@]}"; do [[ "$name" == "$ex"* ]] && skip=1; done
            [[ $skip -eq 1 ]] && continue
            # A missing/unreadable file makes the grep below evaluate false inside
            # an `if`, which is exempt from errexit — so the migration would pass
            # the RLS gate without ever being inspected.
            if [[ ! -r "$dir/migration.sql" ]]; then
              echo "::error::Migration $name has no readable migration.sql"
              exit 1
            fi
            if grep -qi 'CREATE TABLE' "$dir/migration.sql" && ! grep -qi 'ROW LEVEL SECURITY' "$dir/migration.sql"; then
              echo "::error::Migration $name creates a table without ENABLE ROW LEVEL SECURITY"
              exit 1
            fi
          done
          echo "All post-lockdown migrations with CREATE TABLE enable RLS."

      - name: Apply migrations
        run: npm run prisma:migrate:deploy -w @venue-wrangler/api

      - name: Verify critical constraints in runtime and integration databases
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          # Prisma cannot express partial indexes in schema.prisma. Guard the
          # production invariants that live only in SQL migrations.
          required_indexes=(
            TimeEntry_profileId_open_key
            WorkplaceJoinRequest_one_pending_per_user_venue_idx
            Invite_phone_idx
            Profile_unclaimed_venue_email_key
            Profile_userId_venueless_key
            ManagerGoal_venue_title_date_open_key
            Conversation_one_system_group_per_venue_key
            Venue_code_idx
          )
          for database in venuetest venuetest_integration; do
            for index in "${required_indexes[@]}"; do
              found="$(psql -h localhost -U postgres -d "$database" -Atc \
                "SELECT 1 FROM pg_indexes WHERE indexname = '${index}'")"
              if [[ "$found" != "1" ]]; then
                echo "::error::Missing required index in ${database}: ${index}"
                exit 1
              fi
              echo "✓ ${database}: ${index}"
            done
            # VW-A16: Guard against proconfig being silently lost on public user-defined RPCs via CREATE OR REPLACE
            unpinned_funcs="$(psql -h localhost -U postgres -d "$database" -Atc \
              "SELECT p.proname FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace LEFT JOIN pg_depend d ON d.objid = p.oid AND d.deptype = 'e' WHERE n.nspname = 'public' AND p.proconfig IS NULL AND d.objid IS NULL")"
            if [[ -n "$unpinned_funcs" ]]; then
              echo "::error::Functions missing search_path pin in ${database}: ${unpinned_funcs}"
              exit 1
            fi
            echo "✓ ${database}: all public user-defined functions have search_path pinned"

            required_checks=(
              TimeEntry_open_state_check
              Message_text_len_check
              LogbookEntry_body_len_check
              EmailTemplate_body_len_check
              EmailTemplate_subject_len_check
              StaffRequest_title_len_check
              StaffRequest_details_len_check
            )
            for check in "${required_checks[@]}"; do
              found_check="$(psql -h localhost -U postgres -d "$database" -Atc \
                "SELECT 1 FROM pg_constraint WHERE conname = '${check}'")"
              if [[ "$found_check" != "1" ]]; then
                echo "::error::Missing ${check} constraint in ${database}"
                exit 1
              fi
              echo "✓ ${database}: ${check}"
            done
          done

      - name: Smoke-test health endpoint
        run: |
          node packages/api/dist/main.js &
          SERVER_PID=$!
          echo "Waiting for server to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:4000/api/health >/dev/null 2>&1; then
              echo "✓ Health check passed"
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          echo "✗ Server did not start in time"
          kill $SERVER_PID 2>/dev/null
          exit 1
