<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Billing | Venue Wrangler</title>
  <link rel="canonical" href="https://venuewrangler.com/billing/" />
  <meta property="og:url" content="https://venuewrangler.com/billing/" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,sans-serif; background:#f4f8f4; color:#1f2a24; }
    main { width:min(100%,520px); background:#fff; border:1px solid #d8e1d9; border-radius:20px; padding:32px; }
    a { color:#356b4a; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Billing update received</h1>
    <p id="message">If you completed checkout, your venue subscription will activate in a few seconds. Open the Venue Wrangler app to continue.</p>
    <p><a href="venuewrangler://billing">Open the app</a> · <a href="/support/">Need help?</a></p>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('connect')) {
      document.getElementById('title').textContent = 'Stripe account setup';
      document.getElementById('message').textContent = params.get('connect') === 'refresh'
        ? 'Your setup link expired. Open Billing in the Venue Wrangler app and tap Continue Stripe setup for a new link.'
        : 'Open Billing in the Venue Wrangler app and refresh your deposit account status. If Stripe needs more information, tap Continue Stripe setup.';
    } else if (params.has('deposit')) {
      document.getElementById('title').textContent = 'Event deposit checkout';
      document.getElementById('message').textContent = 'Open the Venue Wrangler app to review the deposit status. A payment is marked paid only after Stripe confirms it.';
    }
  </script>
</body>
</html>
