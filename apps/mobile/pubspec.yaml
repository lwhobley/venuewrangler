name: venuewrangler_mobile
description: Venue Wrangler mobile app (Flutter + Supabase).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.6.2

  # Supabase
  supabase_flutter: ^2.8.0

  # Immutable models / serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Secure local storage for session-sensitive values
  flutter_secure_storage: ^9.2.4

  # Offline/connectivity
  connectivity_plus: ^6.1.0

  # Error monitoring
  sentry_flutter: ^8.11.2

  # Media
  image_picker: ^1.1.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3

flutter:
  uses-material-design: true
