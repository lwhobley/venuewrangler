name: venuewrangler_mobile
description: Venue Wrangler mobile app (Flutter + Supabase).
publish_to: "none"
version: 1.13.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  # Routing
  go_router: ^14.6.2

  # Supabase
  supabase_flutter: ^2.18.3
  # Classify HTTP transport failures for offline retries on every platform.
  http: ^1.6.0

  # Immutable models / serialization
  # Secure local storage for session-sensitive values
  flutter_secure_storage: ^10.3.4

  # Offline/connectivity
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.5

  # Error monitoring
  sentry_flutter: ^9.30.1

  # Media
  image_picker: ^1.1.2

  # Generic document picker (PDF/Office/text) for features/documents — image_picker alone
  # can't select non-image files. See features/documents/README.md.
  file_picker: ^8.3.7

  # Opening Stripe's hosted Checkout/Customer Portal URLs in an external browser — the app
  # never embeds a payment form or touches Stripe secret material (see features/billing/README.md)
  url_launcher: ^6.3.1

  # Client-generated primary keys for idempotent offline-queued inserts (see
  # features/checklists/data/checklists_repository.dart)
  uuid: ^4.5.1

  # SHA-256 of the punch payload for the Android Play Integrity requestHash (already in the
  # lockfile transitively; declared directly because the app imports it).
  crypto: ^3.0.3

  cupertino_icons: ^2.0.0

  # Android push token acquisition only — iOS uses native APNs directly (see
  # ios/Runner/PushNotificationsPlugin.swift) via notifications-send's APNS_KEY/APNS_KEY_ID/
  # APNS_TEAM_ID/APNS_BUNDLE_ID secrets, rather than bridging iOS through Firebase too. As of
  # 2026-10-05 those secrets are NOT yet set on the live project — notifications-send will error
  # on iOS push until they are (see supabase/.env.example). firebase_core is required by
  # firebase_messaging regardless of platform, but
  # Firebase.initializeApp() itself is only ever called when running on Android (see
  # app/bootstrap.dart) — iOS has no google-services equivalent file and doesn't need one here.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  geolocator: ^14.0.2

  # App-open intro video (app/intro_video_screen.dart)
  video_player: ^2.9.2

  # Hosts the bundled Three.js room preview on iOS and Android (features/floor_studio). Web uses
  # an iframe instead, see floor_studio_3d_view_web.dart.
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only: mocking the platform-interface singletons for
  # url_launcher/flutter_secure_storage, so tests can
  # fake a plugin's behavior instead of hitting a real platform channel that doesn't exist on
  # a test host. Already present transitively via supabase_flutter/url_launcher/
  # flutter_secure_storage; pinned here explicitly rather than relying on that.
  url_launcher_platform_interface: ^2.3.2
  flutter_secure_storage_platform_interface: ^2.1.1

