<div id="scene-error"></div>
<script>
  // Classic script: runs even when the module below fails to load, so failures reach the
  // host app (mobile channel) and show on screen instead of leaving a blank canvas.
  window.__eventtwinReport = function (kind, detail) {
    var text = detail == null ? '' : String(detail);
    try {
      if (window.EventTwinHost) {
        window.EventTwinHost.postMessage(JSON.stringify({ kind: kind, detail: text }));
      }
    } catch (_) {}
    if (kind === 'error') {
      var el = document.getElementById('scene-error');
      if (el) {
        el.style.display = 'block';
        el.style.whiteSpace = 'pre-line';
        el.textContent = (el.textContent ? el.textContent + String.fromCharCode(10) : '') + text;
      }
    }
  };
  window.addEventListener('error', function (event) {
    var target = event.target;
    var detail = event.message ||
      ('Failed to load ' + ((target && (target.src || target.href)) || 'a resource'));
    window.__eventtwinReport('error', detail);
  }, true);
  window.addEventListener('unhandledrejection', function (event) {
    var reason = event.reason;
    window.__eventtwinReport('error', (reason && reason.message) || reason);
  });
  setTimeout(function () {
    if (!window.__eventtwinBooted) {
      window.__eventtwinReport('error', 'The 3D scene script did not start (a module failed to load).');
    }
  }, 8000);
</script>

{

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

window.__eventtwinBooted = true;
const report = (kind, detail) => window.__eventtwinReport?.(kind, detail);

const container = document.getElementById('app');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdfe6e3);
scene.fog = new THREE.Fog(0xdfe6e3, 20, 60);

const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
camera.position.set(8, 9, 12);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 2;
controls.maxDistance = 60;

scene.add(new THREE.HemisphereLight(0xf5f7f5, 0x4b4536, 0.65));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.4);
sun.position.set(10, 16, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -20;
sun.shadow.camera.right = 20;
sun.shadow.camera.top = 20;
sun.shadow.camera.bottom = -20;
sun.shadow.bias = -0.0015;
scene.add(sun);

const floorMaterial = new THREE.MeshStandardMaterial({
  color: 0xc9b89a,
  roughness: 0.75,
  metalness: 0.05,
});
const wallMaterial = new THREE.MeshStandardMaterial({
  color: 0xf2efe8,
  roughness: 0.9,
  metalness: 0.0,
});
const tableTopMaterial = new THREE.MeshStandardMaterial({
  color: 0xf5f2ea,
  roughness: 0.4,
  metalness: 0.0,
});
const tableSkirtMaterial = new THREE.MeshStandardMaterial({
  color: 0x8f2d35,
  roughness: 0.6,
  metalness: 0.0,
});
const chairMaterial = new THREE.MeshStandardMaterial({
  color: 0x3a3f4b,
  roughness: 0.55,
  metalness: 0.1,
});
const plateMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.25,
  metalness: 0.05,
});
const personPalette = [0x4c6b8a, 0x8a5a44, 0x5c8a5f, 0x7a5c8a, 0x8a7a4c, 0x4c8a84];
const foodPalette = [0xc97b3c, 0x8a9a4c, 0xb04c4c, 0xd9a441];

const WALL_HEIGHT = 2.7;
const CHAIR_GAP = 0.45;

// Free CC0 props from Poly Haven (polyhaven.com), bundled under models/.
const DECOR_MODELS = {
  vaseA: ['ceramic_vase_01', 'ceramic_vase_01_1k.gltf'],
  vaseB: ['brass_vase_02', 'brass_vase_02_1k.gltf'],
  chandelier: ['Chandelier_01', 'Chandelier_01_1k.gltf'],
  fern: ['fern_02', 'fern_02_1k.gltf'],
  plant: ['pachira_aquatica_01', 'pachira_aquatica_01_1k.gltf'],
  sofa: ['Sofa_01', 'Sofa_01_1k.gltf'],
  armchair: ['ArmChair_01', 'ArmChair_01_1k.gltf'],
  ottoman: ['Ottoman_01', 'Ottoman_01_1k.gltf'],
  coffeeTable: ['CoffeeTable_01', 'CoffeeTable_01_1k.gltf'],
  buffetTable: ['WoodenTable_02', 'WoodenTable_02_1k.gltf'],
  cheese: ['CheeseBox_01', 'CheeseBox_01_1k.gltf'],
  croissant: ['croissant', 'croissant_1k.gltf'],
  cake: ['strawberry_chocolate_cake', 'strawberry_chocolate_cake_1k.gltf'],
  wine: ['wine_bottles_01', 'wine_bottles_01_1k.gltf'],
  mirror: ['ornate_mirror_01', 'ornate_mirror_01_1k.gltf'],
};

const gltfLoader = new GLTFLoader();
const modelTemplates = {};
const modelsReady = Promise.all(
  Object.entries(DECOR_MODELS).map(
    ([key, [id, filename]]) =>
      new Promise((resolve) => {
        gltfLoader.load(
          `models/${id}/${filename}`,
          (gltf) => {
            modelTemplates[key] = gltf.scene;
            resolve();
          },
          undefined,
          () => resolve(), // Missing/failed prop: skip it, don't block the scene.
        );
      }),
  ),
);

function decorInstance(key) {
  const template = modelTemplates[key];
  if (!template) return null;
  const instance = template.clone(true);
  instance.traverse((node) => {
    if (node.isMesh) {
      node.castShadow = true;
      node.receiveShadow = true;
    }
  });
  return instance;
}

let roomGroup = null;
// Textures and materials made for the current room's objects, freed with the room.
let roomResources = [];

function clearRoom() {
  if (roomGroup) {
    scene.remove(roomGroup);
    roomGroup.traverse((obj) => {
      if (obj.geometry) obj.geometry.dispose();
    });
  }
  roomResources.forEach((resource) => resource.dispose());
  roomResources = [];
  roomGroup = new THREE.Group();
  scene.add(roomGroup);
}

function addFloorAndWalls(width, depth) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(width, depth), floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(width / 2, 0, depth / 2);
  floor.receiveShadow = true;
  roomGroup.add(floor);

  const backWall = new THREE.Mesh(
    new THREE.BoxGeometry(width, WALL_HEIGHT, 0.12),
    wallMaterial,
  );
  backWall.position.set(width / 2, WALL_HEIGHT / 2, 0);
  backWall.receiveShadow = true;
  roomGroup.add(backWall);

  const leftWall = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, WALL_HEIGHT, depth),
    wallMaterial,
  );
  leftWall.position.set(0, WALL_HEIGHT / 2, depth / 2);
  leftWall.receiveShadow = true;
  roomGroup.add(leftWall);

  const rightWall = leftWall.clone();
  rightWall.position.set(width, WALL_HEIGHT / 2, depth / 2);
  roomGroup.add(rightWall);
}

function addTable(x, z, diameter, seatsPerTable, occupiedSeats, index) {
  const radius = diameter / 2;
  const table = new THREE.Group();
  table.position.set(x, 0, z);

  const centerpiece = decorInstance(index % 2 === 0 ? 'vaseA' : 'vaseB');
  if (centerpiece) {
    centerpiece.position.set(0, 0.775, 0);
    table.add(centerpiece);
  }

  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(radius, radius, 0.05, 48),
    tableTopMaterial,
  );
  top.position.y = 0.75;
  top.castShadow = true;
  top.receiveShadow = true;
  table.add(top);

  const skirt = new THREE.Mesh(
    new THREE.CylinderGeometry(radius * 0.98, radius * 0.98, 0.72, 48, 1, true),
    tableSkirtMaterial,
  );
  skirt.position.y = 0.75 - 0.72 / 2;
  skirt.castShadow = true;
  table.add(skirt);

  for (let i = 0; i < seatsPerTable; i++) {
    const angle = (i / seatsPerTable) * Math.PI * 2;
    const seatRadius = radius + CHAIR_GAP;
    const sx = Math.sin(angle) * seatRadius;
    const sz = Math.cos(angle) * seatRadius;
    const occupied = i < occupiedSeats;

    const chair = new THREE.Mesh(
      new THREE.BoxGeometry(0.42, 0.85, 0.42),
      chairMaterial,
    );
    chair.position.set(sx, 0.425, sz);
    chair.lookAt(table.position.x, 0.425, table.position.z);
    chair.castShadow = true;
    table.add(chair);

    const plateAngle = angle + Math.PI;
    const px = Math.sin(plateAngle) * (radius - 0.22);
    const pz = Math.cos(plateAngle) * (radius - 0.22);
    const plate = new THREE.Mesh(
      new THREE.CylinderGeometry(0.13, 0.13, 0.015, 24),
      plateMaterial,
    );
    plate.position.set(px, 0.78, pz);
    plate.castShadow = true;
    table.add(plate);

    if (occupied) {
      const food = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 16, 12),
        new THREE.MeshStandardMaterial({
          color: foodPalette[i % foodPalette.length],
          roughness: 0.6,
        }),
      );
      food.position.set(px, 0.82, pz);
      food.castShadow = true;
      table.add(food);

      const person = buildPerson(personPalette[i % personPalette.length]);
      const seatAngle = angle;
      const personRadius = seatRadius + 0.05;
      person.position.set(
        Math.sin(seatAngle) * personRadius,
        0,
        Math.cos(seatAngle) * personRadius,
      );
      person.lookAt(table.position.x, 0, table.position.z);
      table.add(person);
    }
  }

  roomGroup.add(table);
}

function buildPerson(color) {
  const group = new THREE.Group();
  const bodyMaterial = new THREE.MeshStandardMaterial({ color, roughness: 0.7 });
  const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xe0b089, roughness: 0.6 });

  const torso = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.17, 0.5, 4, 8),
    bodyMaterial,
  );
  torso.position.y = 0.95;
  torso.castShadow = true;
  group.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 16), skinMaterial);
  head.position.y = 1.38;
  head.castShadow = true;
  group.add(head);

  return group;
}

function addRoomDecor(width, depth) {
  const chandelier = decorInstance('chandelier');
  if (chandelier) {
    chandelier.position.set(width / 2, WALL_HEIGHT - 0.1, depth / 2);
    roomGroup.add(chandelier);
  }

  const fern = decorInstance('fern');
  if (fern) {
    fern.position.set(0.8, 0, 0.8);
    roomGroup.add(fern);
  }
  const plant = decorInstance('plant');
  if (plant) {
    plant.position.set(width - 0.8, 0, 0.8);
    roomGroup.add(plant);
  }

  const mirror = decorInstance('mirror');
  if (mirror) {
    mirror.position.set(width / 2, 1.6, 0.05);
    mirror.rotation.y = Math.PI;
    roomGroup.add(mirror);
  }

  // A lounge nook and buffet spread only fit in rooms with enough spare floor space.
  if (width >= 9 && depth >= 7) {
    const sofa = decorInstance('sofa');
    if (sofa) {
      sofa.position.set(width - 1.6, 0, depth - 1.1);
      sofa.rotation.y = Math.PI;
      roomGroup.add(sofa);
    }
    const coffeeTable = decorInstance('coffeeTable');
    if (coffeeTable) {
      coffeeTable.position.set(width - 1.6, 0, depth - 2.2);
      roomGroup.add(coffeeTable);
    }
    const armchairLeft = decorInstance('armchair');
    if (armchairLeft) {
      armchairLeft.position.set(width - 2.6, 0, depth - 2.4);
      armchairLeft.rotation.y = Math.PI / 4;
      roomGroup.add(armchairLeft);
    }
    const armchairRight = decorInstance('armchair');
    if (armchairRight) {
      armchairRight.position.set(width - 0.6, 0, depth - 2.4);
      armchairRight.rotation.y = -Math.PI / 4;
      roomGroup.add(armchairRight);
    }
    const ottoman = decorInstance('ottoman');
    if (ottoman) {
      ottoman.position.set(width - 1.6, 0, depth - 3.1);
      roomGroup.add(ottoman);
    }

    const buffetTable = decorInstance('buffetTable');
    if (buffetTable) {
      buffetTable.position.set(1.4, 0, depth - 1.0);
      roomGroup.add(buffetTable);
      const buffetTopY = 0.75;
      const cake = decorInstance('cake');
      if (cake) {
        cake.position.set(0.9, buffetTopY, depth - 1.0);
        roomGroup.add(cake);
      }
      const cheese = decorInstance('cheese');
      if (cheese) {
        cheese.position.set(1.4, buffetTopY, depth - 0.7);
        roomGroup.add(cheese);
      }
      const croissant = decorInstance('croissant');
      if (croissant) {
        croissant.position.set(1.7, buffetTopY, depth - 1.25);
        roomGroup.add(croissant);
      }
      const wine = decorInstance('wine');
      if (wine) {
        wine.position.set(1.9, buffetTopY, depth - 0.9);
        roomGroup.add(wine);
      }
    }
  }
}

// Custom room objects, drawn from primitives. Units are meters; `x`/`y` is the centre on the
// floor (y maps to the scene's z axis, as for tables), and rotationDegrees turns the object
// about the vertical axis. Each kind has a fixed look and a height for its label.
const OBJECT_LABEL_HEIGHT = {
  stage: 0.85,
  bar: 1.9,
  dance_floor: 0.5,
  dj_booth: 1.5,
  podium: 1.5,
  buffet: 1.1,
  backdrop: 2.8,
  planter: 1.2,
  placeholder: 1.1,
};

function trackedMaterial(params) {
  const material = new THREE.MeshStandardMaterial(params);
  roomResources.push(material);
  return material;
}

function addPart(group, geometry, color, x, y, z, options = {}) {
  const mesh = new THREE.Mesh(
    geometry,
    trackedMaterial({ color, roughness: options.roughness ?? 0.6, metalness: 0 }),
  );
  mesh.position.set(x, y, z);
  if (options.rotationX) mesh.rotation.x = options.rotationX;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  group.add(mesh);
  return mesh;
}

function addBox(group, w, h, d, x, y, z, color, options) {
  return addPart(group, new THREE.BoxGeometry(w, h, d), color, x, y, z, options);
}

function addCylinder(group, radius, height, x, y, z, color, options) {
  return addPart(
    group,
    new THREE.CylinderGeometry(radius, radius, height, 32),
    color,
    x,
    y,
    z,
    options,
  );
}

function roundedCanvasPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// A flat label that always faces the camera, showing the object's description.
function labelSprite(text, height) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  roundedCanvasPath(ctx, 4, 24, 504, 80, 18);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
  ctx.fill();
  ctx.font = '600 46px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.fillStyle = '#263238';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  let label = String(text || '').trim() || 'Object';
  while (label.length > 1 && ctx.measureText(label).width > 480) {
    label = label.slice(0, -2) + '…';
  }
  ctx.fillText(label, 256, 66);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
  roomResources.push(texture, material);
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(2.6, 0.65, 1);
  sprite.position.y = height;
  sprite.renderOrder = 10;
  return sprite;
}

// Two-by-two checker tile, repeated over a dance floor so each square is about half a metre.
function danceFloorTexture(width, depth) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#2a2638';
  ctx.fillRect(0, 0, 128, 128);
  ctx.fillStyle = '#c2578f';
  ctx.fillRect(0, 0, 64, 64);
  ctx.fillRect(64, 64, 64, 64);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.wrapS = THREE.RepeatWrapping;
  texture.wrapT = THREE.RepeatWrapping;
  texture.repeat.set(width, depth);
  roomResources.push(texture);
  return texture;
}

const objectBuilders = {
  stage(group, w, d) {
    addBox(group, w, 0.5, d, 0, 0.25, 0, 0x2b2f38);
    addBox(group, w, 0.05, d, 0, 0.525, 0, 0xe8e4d8, { roughness: 0.4 });
  },
  bar(group, w, d) {
    addBox(group, w, 1.05, d, 0, 0.525, 0, 0x6b4a2f, { roughness: 0.7 });
    addBox(group, w + 0.06, 0.05, d + 0.06, 0, 1.075, 0, 0x2a2220, { roughness: 0.3 });
    // Back shelving: two uprights and two shelf tiers, behind the counter.
    const shelfZ = -d / 2 + 0.15;
    for (const sx of [-w / 2 + 0.05, w / 2 - 0.05]) {
      addBox(group, 0.05, 1.6, 0.05, sx, 0.8, shelfZ, 0x4a3323);
    }
    addBox(group, w, 0.04, 0.3, 0, 1.2, shelfZ, 0x6b4a2f);
    addBox(group, w, 0.04, 0.3, 0, 1.55, shelfZ, 0x6b4a2f);
  },
  dance_floor(group, w, d) {
    const texture = danceFloorTexture(w, d);
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(w, d),
      trackedMaterial({ map: texture, roughness: 0.35, metalness: 0 }),
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = 0.03;
    floor.receiveShadow = true;
    group.add(floor);
  },
  dj_booth(group, w, d) {
    addBox(group, w, 1.0, d, 0, 0.5, 0, 0x1d1f26);
    // Angled equipment panel on the front edge.
    addBox(group, w * 0.9, 0.45, 0.05, 0, 1.12, d / 2 - 0.12, 0x5c6bc0, {
      rotationX: -0.5,
      roughness: 0.4,
    });
  },
  podium(group, w, d) {
    const radius = Math.min(w, d) / 2;
    addCylinder(group, radius, 1.1, 0, 0.55, 0, 0x4a3b2c);
    addCylinder(group, radius * 1.06, 0.06, 0, 1.13, 0, 0xd7c7a5, { roughness: 0.4 });
  },
  buffet(group, w, d) {
    // Cloth-draped body with a white top.
    addBox(group, w, 0.72, d, 0, 0.36, 0, 0xf4f1e8, { roughness: 0.9 });
    addBox(group, w + 0.03, 0.04, d + 0.03, 0, 0.74, 0, 0xffffff, { roughness: 0.8 });
  },
  backdrop(group, w) {
    const panel = new THREE.Mesh(
      new THREE.PlaneGeometry(w, 2.4),
      trackedMaterial({ color: 0x3d4450, roughness: 0.8, metalness: 0, side: THREE.DoubleSide }),
    );
    panel.position.y = 1.2;
    panel.castShadow = true;
    group.add(panel);
    addBox(group, w, 0.05, 0.3, 0, 0.025, 0, 0x2b2f38);
  },
  planter(group, w, d) {
    const radius = Math.min(w, d) / 2;
    addCylinder(group, radius * 0.9, 0.6, 0, 0.3, 0, 0x8a5a3c);
    addPart(
      group,
      new THREE.SphereGeometry(radius * 0.95, 24, 16),
      0x3f8f4a,
      0,
      0.6 + radius * 0.6,
      0,
    );
  },
  placeholder(group, w, d) {
    addBox(group, w, 0.9, d, 0, 0.45, 0, 0x9aa0a6);
  },
};

function renderObjects(objects) {
  for (const object of objects) {
    const values = [object.x, object.y, object.widthMeters, object.depthMeters];
    if (!values.every(Number.isFinite)) continue;
    const kind = objectBuilders[object.kind] ? object.kind : 'placeholder';
    const group = new THREE.Group();
    group.position.set(object.x, 0, object.y);
    group.rotation.y = ((Number(object.rotationDegrees) || 0) * Math.PI) / 180;
    objectBuilders[kind](group, object.widthMeters, object.depthMeters);
    group.add(labelSprite(object.description, OBJECT_LABEL_HEIGHT[kind]));
    roomGroup.add(group);
  }
}

// Frames the room from the same viewing angle as before. It only pulls back when the floor
// would not fit the viewport's width (narrow phone previews), so far corners and objects stay
// on screen. Rooms that already fit keep the original framing.
function frameRoom(width, depth) {
  const target = new THREE.Vector3(width / 2, 0.9, depth / 2);
  const offset = new THREE.Vector3(width * 0.5, Math.max(6, width * 0.4) - 0.9, depth * 0.6);
  const halfDiagonal = Math.hypot(width, depth) / 2 + 0.5;
  const halfVerticalFov = THREE.MathUtils.degToRad(camera.fov / 2);
  const halfHorizontalFov = Math.atan(Math.tan(halfVerticalFov) * camera.aspect);
  const neededDistance = halfDiagonal / Math.tan(halfHorizontalFov);
  const scale = Math.max(1, neededDistance / offset.length());
  controls.target.copy(target);
  camera.position.copy(target).add(offset.multiplyScalar(scale));
  controls.update();
}

let renderToken = 0;

async function render(data) {
  const token = ++renderToken;
  clearRoom();
  addFloorAndWalls(data.widthMeters, data.heightMeters);
  data.tables.forEach((table, index) => {
    addTable(
      table.x,
      table.y,
      data.tableDiameterMeters,
      data.seatsPerTable,
      table.occupiedSeats,
      index,
    );
  });
  frameRoom(data.widthMeters, data.heightMeters);

  await modelsReady;
  if (token !== renderToken) return; // A newer render replaced this one while models loaded.
  addRoomDecor(data.widthMeters, data.heightMeters);
  renderObjects(data.objects || []);
  report('rendered');
}

function resize() {
  const w = container.clientWidth || 1;
  const h = container.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

window.addEventListener('message', (event) => {
  const data = event.data;
  if (data && data.type === 'eventtwin-room-scene') {
    renderSafely(data.payload);
  }
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Let the host page know we're ready to receive scene data.
function renderSafely(data) {
  render(data).catch((error) => report('error', (error && error.message) || error));
}

// Mobile hosts store the scene in a global and fire `eventtwin-scene`. Checking the global
// at startup as well means the order of page load and data delivery doesn't matter.
function applyPendingScene() {
  const data = window.__eventtwinScene;
  if (!data) return;
  window.__eventtwinScene = null;
  renderSafely(data);
}
window.addEventListener('eventtwin-scene', applyPendingScene);
applyPendingScene();

// `frame` lets a host with several previews tell which iframe is ready.
const frameId = new URLSearchParams(window.location.search).get('frame');
window.parent.postMessage({ type: 'eventtwin-room-scene-ready', frame: frameId }, '*');
report('ready');
</script>
</body>
</html>
